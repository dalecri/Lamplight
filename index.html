    :root {
      --ink: #211f30;
      --paper: #e9e4f0;
      --surface: #29273c;
      --surface-2: #302d46;
      --amber: #a893c9;
      --amber-soft: #a893c9;
      --muted: #9089ab;
      --line: rgba(168,147,201,0.18);
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #root { height: 100%; overflow: hidden; }

      background: linear-gradient(160deg, #2a2136 0%, #241e30 100%);
      background-attachment: fixed;
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;

    }
    .font-display { font-family: var(--font-display, 'Fraunces', serif); }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .auth-input::placeholder { color: rgba(255,255,255,0.6); }

    .spine-lift {
      transform: rotate(var(--tilt, 0deg));
      transition: transform 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .spine-lift:hover { transform: rotate(var(--tilt, 0deg)) translateY(-10px); }
      .spine-lift:hover .spine-reveal { opacity: 1; }
    }

    .spine-mobile-wrap {
      position: relative;
      width: var(--sw);
      height: var(--sh);
    }
    .spine-mobile-wrap.stack-mode {
      width: var(--ml) !important;
      height: var(--swm) !important;
    }
    .spine-mobile-wrap.stack-mode .spine-lift {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      width: var(--swm) !important;
      height: var(--ml) !important;
      transform: translate(-50%, -50%) rotate(-90deg) !important;
      transform-origin: center !important;
    }
    @media (hover: hover) and (pointer: fine) {
      .spine-mobile-wrap.stack-mode .spine-lift:hover {
        transform: translate(-50%, -50%) rotate(-90deg) translateY(-10px) !important;
      }
    }
    .spine-mobile-wrap.stack-mode .icon-upright {
      --tw-rotate: 90deg !important;
    }

    @keyframes cloudFloat {
      0% { transform: translateX(-30vw); opacity: 0; }
      10% { opacity: var(--cloud-op, 1); }
      90% { opacity: var(--cloud-op, 1); }
      100% { transform: translateX(130vw); opacity: 0; }
    }
    .sky-cloud-anim { animation-name: cloudFloat; animation-timing-function: linear; animation-iteration-count: infinite; }

    @keyframes starTwinkle {
      0%, 100% { opacity: var(--star-op, 0.6); }
      15% { opacity: calc(var(--star-op, 0.6) * 0.15); }
      30% { opacity: var(--star-op, 0.6); }
      45% { opacity: calc(var(--star-op, 0.6) * 0.35); }
      60% { opacity: var(--star-op, 0.6); }
    }
    .sky-star-anim { animation: starTwinkle 2.6s ease-in-out infinite; }
    .sky-star-anim:nth-of-type(2n) { animation-delay: -0.7s; }
    .sky-star-anim:nth-of-type(3n) { animation-delay: -1.3s; }
    .sky-star-anim:nth-of-type(4n) { animation-delay: -0.4s; }

    /* Shooting star: one smooth linear travel-and-fade per loop, occupying only the first
       slice of the animation's total duration — the rest of the duration is an invisible
       pause, so with varied per-instance durations/delays they each streak by "every so
       often" rather than all constantly. No stepping: transform and opacity animate together
       on the same element as one continuous motion, matching whatever angle the wrapper div
       is rotated to (the sprite artwork itself is drawn as a pure horizontal streak, so it
       always visually points the same way it travels). */
    @keyframes shootMove {
      0% { opacity: 0; transform: translateX(-8vw); }
      2% { opacity: 1; }
      13% { opacity: 1; transform: translateX(55vw); }
      17% { opacity: 0; transform: translateX(70vw); }
      17.01% { opacity: 0; transform: translateX(-8vw); }
      100% { opacity: 0; transform: translateX(-8vw); }
    }
    .sky-shoot-move {
      animation-name: shootMove;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .cute-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 20px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }
    .cute-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 9999px;
      background: linear-gradient(to right, #ffd77a var(--pct, 50%), rgba(255,255,255,0.18) var(--pct, 50%));

    .cute-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: #ffffff;
      margin-top: -6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .cute-slider::-moz-range-track {
      height: 6px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.18);
    }
    .cute-slider::-moz-range-progress {
      height: 6px;
      border-radius: 9999px;
      background: #ffd77a;
    }
    .cute-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: #ffffff;
      border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);

    .reading-page { width: 100%; max-width: 640px; }

    @media (min-width: 1100px) {
      .reading-page { max-width: 860px; }
    }

    @keyframes page-anim-slide {
      from { transform: translateX(calc(100% * var(--page-dir, 1))); }
      to { transform: translateX(0); }
    }
    @keyframes moon-glow-pulse-anim {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .moon-glow-only { animation: moon-glow-pulse-anim 5.5s ease-in-out infinite; }
    @keyframes magnify-pop {
      0% { transform: translateX(-50%) scale(0.4); opacity: 0; }
      60% { transform: translateX(-50%) scale(1.12); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    @keyframes page-anim-fade {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes page-anim-curl {
      from { opacity: 0.55; transform: perspective(1400px) rotateY(calc(75deg * var(--page-dir, 1))); }
      to { opacity: 1; transform: perspective(1400px) rotateY(0deg); }
    }
    .page-anim-slide { animation: page-anim-slide 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .page-anim-fade { animation: page-anim-fade 0.35s ease-out; }
    .page-anim-curl { animation: page-anim-curl 0.32s cubic-bezier(0.22, 1, 0.36, 1); backface-visibility: hidden; }

    @keyframes book-open {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .book-open-anim { animation: book-open 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @media (prefers-reduced-motion: reduce) {
      .book-open-anim { animation: none; }
    }

    .glow {
      background: radial-gradient(circle, rgba(168,147,201,0.4) 0%, rgba(168,147,201,0) 70%);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px; width: 20px;
      border-radius: 50%;
      background: var(--amber-soft);
      box-shadow: 0 0 10px rgba(168,147,201,0.6);
      margin-top: -8px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      -webkit-appearance: none;
      height: 4px;
      background: rgba(244,234,217,0.15);
      border-radius: 4px;
    }
    input[type=range]::-moz-range-thumb {
      height: 20px; width: 20px;
      border: none;
      border-radius: 50%;
      background: var(--amber-soft);
      box-shadow: 0 0 10px rgba(168,147,201,0.6);
    }
    input[type=range]::-moz-range-track {
      height: 4px;
      background: rgba(244,234,217,0.15);
      border-radius: 4px;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.12); }
    }
    .pivot-glow { animation: pulse-glow 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pivot-glow { animation: none; }
    }

    /* --- Playback pill controls: soft spring bounce on press/release --- */
    .pill-btn {
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pill-btn:active {
      transform: scale(0.82);
      transition: transform 0.09s ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .pill-btn, .pill-btn:active { transition: none; transform: none; }
    }

    /* --- Bookmark ribbon poking out the top of an in-progress book spine --- */
    .book-ribbon {
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      width: 62%;
      border-radius: 2px 2px 0 0;
      pointer-events: none;
      z-index: 3;
    }
    .book-ribbon::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 60%;
      background: inherit;
      clip-path: polygon(0 0, 100% 0, 100% 40%, 50% 100%, 0 40%);
      filter: brightness(0.82);
    }

    /* --- Hanging lamp cord: pull down to change reading theme --- */
    .lamp-pull-zone {
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
    }
    .lamp-pull-zone:active { cursor: grabbing; }
    .lamp-snap {
      transition: transform 0.55s cubic-bezier(0.34, 1.8, 0.4, 1);
    }
